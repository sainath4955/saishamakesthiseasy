<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Please Say Yes 💗</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Poppins&display=swap" rel="stylesheet">

<style>
body{
    margin:0;
    height:100vh;
    background:linear-gradient(135deg,#fad0c4,#ff9a9e);
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:Poppins;
    overflow:hidden;
}

.box{
    background:#fff;
    width:420px;
    padding:35px;
    border-radius:24px;
    text-align:center;
    box-shadow:0 30px 70px rgba(0,0,0,.35);
    position:relative;
}

h1{
    font-family:'Playfair Display';
    color:#c9184a;
    margin-bottom:15px;
}

p{
    font-size:15px;
    color:#444;
    line-height:1.8;
}

button{
    padding:12px 30px;
    border:none;
    border-radius:25px;
    font-size:15px;
    cursor:pointer;
    margin:15px;
}

.yes{
    background:#ff4d6d;
    color:#fff;
}

.no{
    background:#999;
    color:#fff;
    position:absolute;
}
</style>
</head>

<body>

<div class="box">
    <h1>Hey <span id="n"></span> 💗</h1>

    <p id="text">
        Thoda soch lo na 😌<br>
        Itna jaldi NO bolna theek nahi hota…
    </p>

    <button class="yes" onclick="goYes()">YES 💖</button>
    <button class="no" id="noBtn" onclick="handleNo()">NO 😶</button>
</div>

<script>
const params = new URLSearchParams(window.location.search);
const name = params.get("name") || "Tum";
document.getElementById("n").innerText = name;

let clickCount = 0;

const noTexts = [
    "NO 😶",
    "Ruko Yaar 🥺",
    "Please 🥹",
    "Mai Ro Dunga 😭"
];

function goYes(){
    location.href = "saisha3.html?name=" + encodeURIComponent(name);
}

function handleNo(){
    const btn = document.getElementById("noBtn");
    const box = document.querySelector(".box");

    clickCount++;

    if(clickCount < 4){
        // change text
        btn.innerText = noTexts[clickCount];

        // move button randomly
        const boxRect = box.getBoundingClientRect();
        const maxX = boxRect.width - btn.offsetWidth;
        const maxY = boxRect.height - btn.offsetHeight;

        btn.style.left = Math.random() * maxX + "px";
        btn.style.top  = Math.random() * maxY + "px";
    } else {
        // final stage: NO becomes YES
        btn.innerText = "YES 💖";
        btn.classList.remove("no");
        btn.classList.add("yes");
        btn.style.position = "static";
        btn.onclick = goYes;
    }
}
</script>

</body>
</html>
