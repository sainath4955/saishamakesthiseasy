<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Proposal 💖</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Poppins&display=swap" rel="stylesheet">

<style>
body{
    margin:0;
    height:100vh;
    background:linear-gradient(135deg,#ff9a9e,#fad0c4);
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:Poppins;
}

.box{
    background:#fff;
    width:420px;
    padding:40px;
    border-radius:24px;
    text-align:center;
    box-shadow:0 30px 70px rgba(0,0,0,.35);
    animation:fadeIn 1.2s ease;
}

@keyframes fadeIn{
    from{opacity:0; transform:translateY(25px);}
    to{opacity:1; transform:translateY(0);}
}

h1{
    font-family:'Playfair Display';
    color:#c9184a;
    margin-bottom:18px;
}

p{
    font-size:15px;
    color:#444;
    line-height:1.9;
    white-space:pre-line;
}

button{
    margin:18px 12px 0;
    padding:12px 30px;
    border:none;
    border-radius:25px;
    cursor:pointer;
    font-size:15px;
}

.yes{
    background:#ff4d6d;
    color:#fff;
}

.no{
    background:#999;
    color:#fff;
}
</style>
</head>

<body>

<div class="box">
    <h1>Hey <span id="n"></span> 💗</h1>
    <p id="proposal"></p>

    <button class="yes" onclick="go('saisha3.html')">YES 💖</button>
    <button class="no" onclick="go('saisha4.html')">NO 😶</button>
</div>

<script>
const params = new URLSearchParams(window.location.search);
const name = params.get("name") || "Tum";
document.getElementById("n").innerText = name;

const proposals = [

`${name} 🌸
seedhi baat bolun toh,
ye koi dramatic proposal nahi hai.
Bas itna sa hai —
tum achhe lagte ho,
aur tumhare saath thoda aur time bitane ka mann karta hai 😌
Toh socha pooch hi loon…
mere saath chaloge? 💗`,

`${name} 💌
pata nahi tum kya soch rahe ho,
par idhar ek simple si feeling hai.
Na zyada expectations,
na filmy promises.
Bas ek sawaal —
kya hum is moment ko haan bol dein? 🌷`,

`${name} 😊
log propose karte waqt bade dialogues bolte hain,
mujhe utna aata nahi.
Mujhe sirf itna pata hai —
tumhare saath baat karna achha lagta hai.
Aur shayad wahi kaafi reason hai 💖`,

`${name} 🌹
ye proposal future ke plans ke liye nahi,
ye sirf abhi ke liye hai.
Abhi ka mood,
abhi ki smile,
abhi ka dil.
Agar ye sab theek lagta hai,
toh jawaab shayad YES ho 😌`,

`${name} ❤️
ye koi pressure wala sawaal nahi hai,
aur na hi koi test.
Bas dil se nikla ek thought —
agar tum saath ho,
toh cheezein thodi aur better lagti hain.
So… kya bolte ho? 💫`

];

// random proposal
const randomProposal = proposals[Math.floor(Math.random() * proposals.length)];
document.getElementById("proposal").innerText = randomProposal;

function go(page){
    location.href = page + "?name=" + encodeURIComponent(name);
}
</script>

</body>
</html>
